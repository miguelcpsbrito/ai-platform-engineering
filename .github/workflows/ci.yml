# Offline CI: every suite that needs no AWS account. Runs on every push and PR, and
# nightly so that drift in pinned dependencies shows up before a reader finds it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_PG_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit, conformance, restore and leakage suites (pgvector + RLS track included)
        run: make test
      - name: Local tracks of the labs
        run: make labs-local

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
      - name: fmt
        run: terraform fmt -recursive -check -diff .
      - name: validate every module
        run: make tf-validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: offline provider-schema check
        run: pip install python-hcl2 && make tf-offline

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      # Reported, not yet enforced: the first release triages the findings (STATUS.md).
      - run: checkov -d . --framework terraform --quiet --soft-fail --skip-path blueprints
