apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  annotations:
    ai-platform/tenant: ${{ values.tenant }}
    ai-platform/alias: ${{ values.alias }}
    ai-platform/risk-tier: "${{ values.riskTier }}"
    ai-platform/blueprint: agent-service@2.0.0
    ai-platform/eval-suite: evals/seed
spec:
  type: service
  lifecycle: experimental
  owner: group:${{ values.tenant }}
