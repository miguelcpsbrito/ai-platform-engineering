apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rag-service
  title: RAG service (platform blueprint v7)
  description: Retrieval-augmented service on the platform — governed inference, tenant-scoped retrieval, evaluation gate, runbook.
  tags: [ai-platform, rag, blueprint]
  annotations:
    ai-platform/blueprint-version: "7.2.0"
spec:
  owner: group:ai-platform
  type: service
  parameters:
    - title: Service
      required: [name, tenant, corpus, alias, riskTier]
      properties:
        name:     { type: string, pattern: "^[a-z][a-z0-9-]{2,40}$" }
        tenant:   { type: string, ui:field: OwnedTenantPicker }
        corpus:   { type: string, description: S3 prefix }
        alias:    { type: string,
                    enum: [fast, standard, premium] }
        riskTier: { type: string, ui:field: IntakeClassifier }
  steps:
  - id: fetch
    action: fetch:template
    input: { url: ./skeleton, values: "${{ parameters }}",
             copyWithoutTemplating: [".pipeline/**"] }
  - id: publish
    action: publish:github
    input: { repoUrl: "github.com?repo=${{ parameters.name }}" }
  - id: register
    action: catalog:register
    input:
      repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
      catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog entry
        entityRef: ${{ steps.register.output.entityRef }}
